name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: |
          $env:Platform = ""
          dotnet build EndOfDayTime.sln --configuration Release --no-incremental
        shell: pwsh

      - name: Run tests
        run: |
          $env:Platform = ""
          dotnet test EndOfDayTime.sln --configuration Release --no-build --verbosity normal
        shell: pwsh

  publish:
    needs: build-and-test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      # The package version comes from the tag (v1.2.3 -> 1.2.3), not from Directory.Build.props.
      - name: Resolve version from tag
        id: version
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not a valid version. Expected vMAJOR.MINOR.PATCH[-prerelease]."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build
        run: |
          $env:Platform = ""
          dotnet build EndOfDayTime.sln --configuration Release --no-incremental -p:Version=${{ steps.version.outputs.version }}
        shell: pwsh

      - name: Run tests
        run: |
          $env:Platform = ""
          dotnet test EndOfDayTime.sln --configuration Release --no-build --verbosity normal
        shell: pwsh

      - name: Pack
        run: |
          $env:Platform = ""
          dotnet pack EndOfDayTime.sln --configuration Release --no-build --output ./nupkgs -p:Version=${{ steps.version.outputs.version }}
        shell: pwsh

      - name: Verify package versions
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packages = @(Get-ChildItem ./nupkgs/*.nupkg)
          if ($packages.Count -eq 0) { throw "No packages were produced." }
          $wrong = @($packages | Where-Object { $_.Name -notlike "*.$version.nupkg" })
          if ($wrong.Count -gt 0) {
            throw "Packages not at version ${version}: $($wrong.Name -join ', ')"
          }
        shell: pwsh

      - name: Publish to NuGet.org
        run: |
          Get-ChildItem ./nupkgs/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
        shell: pwsh

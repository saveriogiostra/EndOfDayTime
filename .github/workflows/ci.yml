name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      # On a tag the package version comes from the tag (v1.2.3 -> 1.2.3).
      # Otherwise the dev default from Directory.Build.props is used.
      - name: Resolve version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Tag '$env:GITHUB_REF_NAME' is not a valid version. Expected vMAJOR.MINOR.PATCH[-prerelease]."
            }
            "version=$version" >> $env:GITHUB_OUTPUT
            "arg=-p:Version=$version" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Build
        run: dotnet build EndOfDayTime.sln --configuration Release --no-incremental ${{ steps.version.outputs.arg }}
        shell: pwsh

      - name: Run tests
        run: dotnet test EndOfDayTime.sln --configuration Release --no-build --verbosity normal
        shell: pwsh

      - name: Pack
        run: dotnet pack EndOfDayTime.sln --configuration Release --no-build --output ./nupkgs ${{ steps.version.outputs.arg }}
        shell: pwsh

      - name: Verify packages
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packages = @(Get-ChildItem ./nupkgs/*.nupkg)
          if ($packages.Count -eq 0) { throw "No packages were produced." }
          if ($version) {
            $wrong = @($packages | Where-Object { $_.Name -notlike "*.$version.nupkg" })
            if ($wrong.Count -gt 0) {
              throw "Packages not at version ${version}: $($wrong.Name -join ', ')"
            }
          }
          $packages | ForEach-Object { $_.Name }
        shell: pwsh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*.nupkg
          if-no-files-found: error

  # Serves the WebForms sample with IIS Express and drives it with a real browser.
  webforms-e2e:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run WebForms end-to-end checks
        run: ./tests/e2e/run-webforms-e2e.ps1
        shell: pwsh

  # Pushes exactly the packages built and tested above.
  publish:
    needs: [build-and-test, webforms-e2e]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs

      # The step's exit code is the last command's, so a push that fails in the
      # middle of the loop would otherwise leave the job green.
      - name: Publish to NuGet.org
        run: |
          $failed = @()
          Get-ChildItem ./nupkgs/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) {
            throw "Push failed for: $($failed -join ', ')"
          }
        shell: pwsh

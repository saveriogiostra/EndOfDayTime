name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: |
          $env:Platform = ""
          dotnet build EndOfDayTime.sln --configuration Release --no-incremental
        shell: pwsh

      - name: Run tests
        run: |
          $env:Platform = ""
          dotnet test EndOfDayTime.sln --configuration Release --no-build --verbosity normal
        shell: pwsh

  publish:
    needs: build-and-test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: |
          $env:Platform = ""
          dotnet build EndOfDayTime.sln --configuration Release --no-incremental
        shell: pwsh

      - name: Run tests
        run: |
          $env:Platform = ""
          dotnet test EndOfDayTime.sln --configuration Release --no-build --verbosity normal
        shell: pwsh

      - name: Pack
        run: |
          $env:Platform = ""
          dotnet pack EndOfDayTime.sln --configuration Release --output ./nupkgs
        shell: pwsh

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        shell: pwsh
